<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0508" />
    <title>Halloween Challenge 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Gothic 2026 theme: the existing orange/purple/yellow classes are remapped so every page
      // picks up the new look (orange = antique gold, purple = burgundy wine, yellow = parchment).
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              orange: {
                50: '#fbf6e8', 100: '#f4e8c4', 200: '#ecd897', 300: '#e3c673', 400: '#d9b45a',
                500: '#a8822f', 600: '#8d6a22', 700: '#6f5218', 800: '#4a3510', 900: '#251a0e', 950: '#140d07',
              },
              purple: {
                50: '#fbeef1', 100: '#f5d6de', 200: '#eab0c0', 300: '#dc8199', 400: '#c8546f',
                500: '#a63352', 600: '#86233f', 700: '#66192f', 800: '#46121f', 900: '#2a0c16', 950: '#170810',
              },
              yellow: {
                50: '#faf6ee', 100: '#f2ebd8', 200: '#e6dabb', 300: '#ddd0a0', 400: '#d8c88f',
                500: '#96803f', 600: '#7a6732', 700: '#5c4d26', 800: '#4a3d1f', 900: '#2e2613',
              },
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', 'Noto Sans Thai', sans-serif;
        background-color: #0b0508;
      }
      .font-display {
        font-family: 'Cinzel Decorative', 'Noto Sans Thai', serif;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
